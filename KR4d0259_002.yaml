body:
  text: 九華集卷二宋員興宗撰七言古詩賀雨并引若嵗大旱用汝作霖雨乃人君命相之辭提刑顯謨自西蜀使華慨念斯民憂於久旱炷香祝天不崇朝獲甘雨蜀路生齒樂意具足與前賢若歸一揆目擊盛事因賦古體以紀盛德嵗若大旱作霖雨禱而雨兮旱不苦誠之一字與天參往古聖賢珍此語嵗星在蜀二十年觸處豐登多黍稌世不少惜蹂踐之枉使寶稼棄如土况復縱恣相憑凌氣熖熏天遽如許三綱五常淪且斁以故傷和逢疸怒旱魃為災熾袢暑撲鹿陽烏乘九數火雲釡甑蒸肉山不奈炎官云我所公方憂民心愈愈掃除熱瘴還清楚却憶曾侍玉帝旁授以金科行按部辦獄更過顔魯公一路傳呼御史雨不聞匹婦且銜寃西蜀向安誰敢侮和以致祥應止止喜見太平舊官府肅時若是號休徴甘澤霑霈來以敘石燕漫飛商羊舞穴處那能問狐鼠巫覡罷散鼓笛間龍德欲歸江海去為言西成祀田祖飽食不驕民樂聚昔何戚嗟今怡悅力回造化公為主濯濯厥靈玉不焚伊格皇天歸宰輔焰焰無若雨反風燮理隂陽且封魯禦災捍患世亦希可但明時繼前古願言霖雨思賢佐鐫入堅珉作詩譜遊漢嘉明月湖次宇文子重韻君不見天台賀季真鑑湖一曲光泠泠又不見錢塘林處士西湖千載成髙名千頃菰蒲抹岸白幾樹寒梅踈影橫呼吸湖光映湖緑兩公便謂得此生吾僚胸次本丘壑中有林賀之髙情銀盤夜色清鏡動便欲邀汝成三人旋喜巨羅金在眼肯議仙桂來無根前時六濁皆運出招此不夜歸重城未蒙濡沫到惡客先苦詩句來繽紛思君對洗同一靜大勝狂歌歸四明紫雲洞府判李文於先大夫祠堂之側因紫雲盤其上乃作洞焉諸公賦詩皆瑞紫雲多以列仙之異言之愚謂跨鼇先生忠誼不沒者也有以瑞其後紫雲蓋有託乎府判又能世其家且大之吾儒之喜頌者也即為賦此君不見茂州長史文章翁生平姓字懸天東英言撼帝帝不從建隆以來無此忠今焉棲神寓玄躬道在翳嘶峰外之髙峰是間真趣排天胸指顧可了荆岱嵩邇年秋練春光融離離渡漢舒溟濛狀殊宋車非越龍兵志宋雲如車越雲如龍亦非石壁浮青紅望之雲逺討其蹤類風飄煙欺霧濃梁簡文賦紫雲詩云金風飄素煙直排閶闔貫紫宫父老語我昭我聾疑是先生不掩之精雄自爾支拄瓊崖中要把英爽飛摩空有如韓王結襦騰騰化異氣魏公試進士是日五色成雲亦如衛生食昴疊疊欺長虹誠於斯民有願力此假竒特將無同先生英名無有盡乃雲無心洞無窮或云礱鑿發天祕不知的的勝事符阿戎勸君不必崑閬通五雲之祥由李宗尹喜望紫雲下得李耳君家種義昭玄穹可隸黃字驅青童掃灑願勿俗子容斗酒為嗔王無功僕自擬績瑞芝知郡李文招賓友於洞之側飲未既有童來前曰適得異草丹其蓋玉其枝童不名其何物也余顧笑曰芝也分幹異本是應竒祥蓋宗祀享答之嚴積猷德耀之及於是乎見之誠不常有之物也豈其大門之慶乎會人有酒乃綴數語以賀明日足是章以志山中盛事云君不見翳嘶路轉重行行玉几有洞含餘清跨鼇棲魂正爾所合沓萬古遺忠名洞口雲騰紫羃羃洞外草茁朱英英從來精爽自難沒地不愛寶天敷榮嘉祥一書世則瑞而况君家二者并請原昨日杯酒事公子沃客金杯傾有童有童跪再拜云得異本由天成主人于于衆客笑春入四座歡縱橫夜如何其不忍去翦燭細看枝瓊瓊有同魏縣玉三幹大似漢宫金九莖巖間義氣埋不得宛轉再露乾坤情公子世猷亦有相他山之石何由生願言勿隱東郭几穩出卧護南陽城天邉瑞蓋兩旌節我相公子非癯卿歌兩淮并引事以詩敘者唐人纍纍有焉然有之而工工之而傳惟少陵樂天二氏乃已也蓋少陵以嚴樂天以詳兩公於事皆工於道達事然矣語未嘗不然則人之從之亦信乎其然也嗚呼風雅數變體厚語極至此可謂難哉吾蜀虞公常援尺箠笞敵兩淮之上敵憤以死此事曠古今一快者賔客欲表著鋪張而緒言之其當取杜乎當用白也吾無適而偏廢矣雖然吾非其人也勉賦悲兩淮一首君不見北風吹淮風浪黑鐡馬千羣凝一色當時廟論孰經濟將相無言潛動魄或云南紀當何憂今代諸葛身姓劉陛下喚取守淮甸彼有勝算踰干矛登時詔語從天墜汜為先鋒錡制置併遣健士付阿權等是兩淮兵馬地豈期將潰兵川流翻手忽忽無十州前時冠劒錯準擬此事吐口貽人羞幸哉天禍不終極至尊避殿憂思集樞臣督戰侍臣謀上則倚公參贊職征鞍此日去皇皇所過騎士多羸傷不見何人出聲鼓意氣但見十十五五坐路傍公趣下馬詢衆語衆共來前致辭苦平時節使驅為奴逐逐無聊戰無主而今側身墮兩失官騎已亡難再得誠令軍政日月懸我有微軀人不惜公聞瑟縮涕澘然汝曹寄命真可憐朝今清明萬乘聖權已殛死家南遷若等是行能奮死朝建勳名暮朱紫官今付我誥如山節使察使皆在此軍家聞此逐蹄輪喜氣酣酣如遇春當時戰死身昧昧今日分付當其人兵官來見同聽命適有時張王戴盛分麾列伍擺布畢髣佛平戎萬全陳斯須望敵來何多千里斷岸皆遮邏天低野曠笳鼓咽衆寡不敵將奈何是時仲冬日建丑初八羣雄爭先莫肯後濯纓刑馬震天地焰焰兵威古無有旋見飛臺天樣齊黃蓋團團傍赤旗指揮渡河在頃刻我默戰義人安知公呼時俊騰口説汝每四方聞膽決只今戰態作兒女便恐汝名從此歇長嘯激俊揮戈回萬斧並下聲如雷十舟先粉百舟敗連艟接艦成飛埃嗟敵初來何草草一夕崩摧如電掃命踰破竹青離離血潰江流紅杲杲明朝北陳更奔波坐料強敵成蹉跎十一月初九日隄防更藉盛新力為我往護楊林河運去一朝同覆水敵再渡江終送死射人射將數不徹何况更問舟中指移時巉天送哭喧棄舟而遁舟自焚公命火攻列火傘船焦楫爛無逃門敵愁驚心疑鶴唳十步回頭九墮淚又疑官軍尾其衆清野數州無食地衆殘北顧心悠悠金亮更欲抵死留放言京口少備者曷若舉兵由潤州大將顯忠來是日執杖升階光照席公先勞苦甚生平遂借百舟如過鷁迤邐仲冬日十二旅食無煙寢無寐公來督府見相公便及瓜洲防拓事督視推公膽有餘此事豈忍他人徂昨來兵試威萬萬别遣諸將無乃迂公仍稟命侵星過或傳鐡騎金山破淮西萬姓舍惟煙淮東居民淚潛墮公擺吳艟異水嬉勢壓海浸傾天維一見使敵無可奈再見使敵心骨悲敵亡傲兀猶不悟尚呼達官招萬户嵗云暮矣無北歸我所思兮決南渡達官再拜乞徐徐波浪駕天千文餘比前采石三倍惡主其急我吾其魚金亮尚嫉忠言醜快劔垂垂擬其首只今速渡汝得活不爾愛身身在否萬户相顧歸相言慓悍難容血靣論北人項領不易保如此郎主何足存此夜踈星江淚濕敵將一一彎弓入御寨三重侍衛郎對靣公然如不識帳中方嬖花不如帳外忽飛金僕姑投哀賒死身困苦軟語不類平時粗骨肉披離頭萬里魂飛却作他鄉鬼殺氣漫天煙草迷不歸州絶風塵起北歸敵訛為不歸州君不見昔日秦魏之兵扼上流阿堅阿瞞皆老謀淝水血腥赤壁潰兩豪一蹶泯默至死休况我中都往頽促千古喪師無此酷沉寃萬衆銜已久合沓天心宜下燭三十年飛戰馬塵支吾多用豪傑人但傳凶勢時未減不見度外加經綸須信更生無盡福髙價屬公勳譽逐不費兩淮千斛水一洗萬古乾坤辱近來分陕從天闕懸解西民愁百結三軍鼎鼎禮意濃七兵堂堂恩數絶行并咸秦脈絡通更遣諸將圖山東為君再賦洗兵馬下客敢繼唐詩翁永嘉水并引韓退之陸渾山火詩變體竒澀之尤者千古之絶唱也併用其韻效之賦永嘉水一首以呈同舍監丞鄭丈蓋丙戌水災曲折得之於鄭也鄭侯興言水于溫厥災茫昧數莫源于時頑秋後中元淫虹曳曳妖暈噴夜星不呈墨微垣鬱律撼怒排天根擺磨雜嶽濤飛軒豁驚瞥悚勢蕩渾凶颶掃寬震虛垠瀿傾瀆裂軸轉坤腷膞萬馬來聲喧衆鼓駭駭闐箎塤湠漫沏送無回沄隂旄威纛空飛騫嬰鮐漂沛趨冥門帶不不屬隳巾褌啾呶直上聲天寃元驅鬼紲俱奔奔肉不擁掩張髀臀母識子死翁號孫凌耶厲耶千山髠而况下數雞鼠豚濘淖飛濺疑翻盆岸津水溽沸雕猿目材耳井其能存我知其端義可援無乃水伯真少恩翹翹抉抉凶凌屯手擘三山巨靈翻大漚幕島叢旗㠾天吳不仁閃雙湲主張龍孽龜魚黿牙眼怖鰐翼厲鯤唅呀擺掉齒腭反禹手不胼息兩跟四載難乘駐厥轓漢家循河昔墊昏側身以蔽太守尊浙東之東孰于藩赤子魚頭浸莫言帝階修修闢重閽媕婀欺天樹幽怨沉家十萬忍不論誰歟廣騷些其魂幸哉皇明煦朝暾羅金走帛恩丘園我咨溫人為周爰河魁之應顛崑崙嗟嗟奚自理不煩常盤喜鮮口吐吞剜元剔鬛命蜿蜿毫髮不備唏空飱以是眩客詔後昆帝敕海若澆愁痕自今起仁略炮燔縱彼川泳鱗鰭掀物不暴殄帝所敦永嘉于于福以蕃嗚呼愈也惟戒焚我則解摘哀窮樊其亦滅愧心可捫遊九頂清音亭次宇文子重韻君不見昔賢聲名渺雲邉追慕茫茫千百載東山遺墨不塵埃南海碑辭尚光彩是公胸懷冰鏡清當時玊署厭殘更惟餘清夢到古寺因為亭宇加修名亭邉古洞可治易何必竹溪師六逸清音不斷山不磨人間衮衮成今昔往日中都朋黨興賢者皆思御李膺元祐諫紙今最重此亭返不蒙知音我聞膠西黃樓賔主列賦就價喧君弟轍彼樓雖已陷幽都名號猶為人記别菜食東坡謂竹為君魯直謂棕栮為君僕以菜為君蓋不欽其味欽其德也食之者無後悔不謂之君可乎員子一寒世無有愛簇生盤如愛酒菠薐鐡甲幾戟唇老莧緋裳公染口駢頭攢玉春試筍搯指探金暮翻韭達官堂饌化溝坑我誦菜君人解否酬新安仁孝主簿汴水奔流天子都海涵百谷來羣儒黑笠白袍紛盈衢清才落筆各有徒人人懷矛戈戟殳文陳未戰磨以須我方整旅備不虞坐驚縶微黨援孤聞君烈烈真丈夫外視宮室呈廉隅於時委身願投壺亦既見止心則愈聨翩折趐同嗟吁奈何西歸不得俱地逺天髙成異區尺書相問藥困痡繼之詩句非常模字妙羲獻堪僕奴幽懷感深長鬱紆魚目安可酬驪珠古今窮達猶摴蒱慎無致意榮且枯六經且務評精粗一朝良媒聘閭娵神房山館魁衆妹哭友人故校書王君夷仲天台插天天一色先生乃在山之側擁書萬卷日逍遙户外絶無塵土客自迹詩書分戰場垂垂六甲皆科郎治言説盡萬物理亦有苦語原天荒保寧之軍憤苛取大夫回回軍吏苦公來約束仗忠信健兒三千膽如鼠倦遊俯仰栖瀛洲吏非𣪚仙矧肯留金門間作林下語對之使我銷百憂人皆病心公病膝歸卧輕舟江月夕君不見書劔只今誰訪君靈鷲蕭蕭墓三尺贈吕德璋道人并引三嵎古異士棲息之地道陵叔皮爾朱之流其故迹在吾鄉者幾見之矣東州吕德璋道人其人質以粹其言敦以簡訪幽尋於三嵎之頂儻可以見吾所不見者乎德璋頗能詩有人倫之鑒且趙侯毅夫客也因賦一篇以贈之世網連天天地窄君乃對人眼青白口占道論餘五千身往仙山尋八百趙侯精靈足詩態員子慙愧今詞伯不須對月人自三他年共作滄浪客謂豫及吕趙别眉山源上人我生喜際招提客欲宜漚幻了塵色偶然揮斥仍六極無相光中豈南北上人得我慰寂寞相與含笑了一默生死奪機無瞬息禪談鶻落霜後翼中間鵠鵠露白黑我欲角角急不得終朝為子寫胸臆回首江山忘鄉國相看一夢非空質山風吹衣馬去櫪君不見九華雖墮名利場逢人也解吞荆棘贈雲上人并引中巖印公元發空門友也詩言森秀羣衲未見其比雖遭竒禍化為異物然殘章斷句當與一世共祕不當與萬物共盡也每深念之涕淚不已昨日玉津上人雲公擕詩見過頗有中巖風氣審詢之即從印公遊者因作一篇酬雲以見老僕志今懷昔之念殷殷如此君不見昔日中巖印元發聲名宇縣何煌煌層冰瑩骨語秀靜松風入齒詩清狂有時健筆賦巖石天地萬象隨低昻儒流稽首頌舌相往往謂帶花木香自從别我無消息江鰐無情江浪黑至今夾岸楓林青嵗老迷魂招不得古來英才多薄命杳杳湘潭絲五色世間妙質便恐無使我哀吟纒八極豈料嘉川餘舊逰雲來雲來開我愁時吐芳鮮恣吞嚼軟語髣佛從湯休勞生乾坤我已倦飲半一嘯滄浪舟三峨聨子憩寂寞下視華屋皆山丘挽喻夫人太丘落日東郊昏蘭風桂露啼幽痕年周九十笑語溫衝頭雪矣花仍存仙裾拂拂始倚門扶挾何必煩諸孫二雛前起慰心魂喻宗老人五院尊衆口咽矣遍地恩柔則之餘六四坤
