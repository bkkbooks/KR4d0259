body:
  text: 提要九華集二十五巻别集類三宋臣等謹案九華集二十五巻附録一巻宋員興宗撰興宗有采石戰勝録已著録其集見于焦竑國史經籍志者本五十巻乃寳慶三年其孫榮祖所編興宗弟夢協井研李心傳俱為之序明以來久佚不存今檢勘永樂大典所録摭拾詮次釐為詩六巻雜文十五巻又論語解老子解畧西陲茟畧併紹興采石大戰始末各一巻而原集所載同時祭文可以互證興宗始末者則别為一巻附之于後集中多與張栻陸九淵往復書簡葢亦講學之家然所上奏議大扺毅然抗論指陳時弊多引繩批根之言李心傳序謂歸附既留而垂遣􅉏御因逐而旋召均輸久廢而驟復此三事皆朝廷所必行而興宗矢茟盡言斥逐不悔則其經濟氣莭均有實事非徒侈空談者矣又洪括撰隸釋時嘗咨以漢碑數事興宗為之考核源委具見精博今答書一通具在集中學問淹雅亦未易及雖其文力追韓栁不無錘鍊過甚之弊然骨力峭勁要無南渡以後冗長蕪蔓之習挺然一作者也乾隆四十六年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀原序三嵎介東西蜀之間雄秀而峻極士生其中大抵莊靖篤實而文亦如之自入國朝以勛勞名節著見者代有其人至於居言語風議之官而正色不回有殞無貳使人望其風稜如與三嵎並立者則余於陳員二公為有感也蓋司諫陳公純益以正論救時於封國之始而太史員公顯道以忠言輔上於乾道之際流風餘韻士皆宗之然陳公之文今不盡見獨封章之載書右録者僅存一二推此志也雖與日月争光可也若員公之文則傳者衆矣髙古簡嚴惟陳言之務去極其所就必欲至杜韓而後止李栁而降非所願也然余之所以重公者豈獨文而已哉當公在館學時國有大議凡掌諫諍司出納與夫執簡立柱者所不敢言而公獨言之歸附既留而垂遣􅉏御因逐而旋召均輸久廢而驟復此三者皆上意所深嚮朝廷所必行而公上不負明主下不阿所好矢筆盡言嚢封亟上雖斥逐致死而不悔也余嘗奉詔増輯中興以来放失舊聞因得公諫草而讀之為之三復流涕不能已也然則余之所有感於公者豈獨文乎哉公沒垂六十年而心傳猥以非才誤膺招聘朅來成府訪别父兄過公舊廬低回而不忍去公之孫榮祖出公遺稿示余求為之序余於公既所深慕而先大夫荷公之知又為有素因而不復辭特著其大節如此使後之生三嵎者全其所鍾雄秀峻極之氣莊靖篤實必如前人而後於斯文為無負尚公之志也始公未仕時屏居郡之九華山自號九華子後人因以名其文然傳於世者視今書纔十七蓋猶有所避就既歴五紀而後全書出焉公名興宗官著作郎兼國史編修官實録院檢討官當修阜陵書時史無専官類以百司所報為准故公之言與事畧不少見今方舉而重修之㑹有知史法者表出之云寳慶三年嵗次丁亥夏四月哉生覇越五日丙辰僰道李心傳序先兄著作未第時著書州之九華山人莫見其靣晚策名奉詔入館慷慨立朝屢以論事辱上眷知視生平所學不愧不幸已矣獨遺稿存耳敬出之與有志古文者共觀焉弟左廸功郎成都府華陽縣尉典寅夢協書
