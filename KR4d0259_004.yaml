body:
  text: 九華集卷四宋員興宗撰五言絶句六月初雨中渡西湖因至道人庵燒佛香略憩靈隱與鄉僧同啜茶乘晚以歸獵獵風欹袖垂垂雨打船最憐荷似屋不障水如天溪頭斷續雨松下送迎僧世境不到處心融意自澄久困塵埃夢暫隨香火緣栖鴉急殘照我亦踏歸船燕居今我非故我行禪坐亦禪送風當八靣一鉢老三川新灘險惡不可前遂出乘灘下舟作詩送灘上舟水靣數千里賴公託此身如何阻惡灘與我為參辰代舟答我實假衆力送君遊蠻荆灘危不可前徒有濟川名再送舟公非不通險任重載者淺此去荷責輕又得先歸便舟再答此去責雖輕恐為商賈資細瓷枉壓我使我成徇私木樨花二首承露珠微微弄態金淺淺秋風一披拂清意忽作逺山空花更幽日透香自永只缺欹月梅同汝弄疏影和何知郡子文冬日即事甲觀吾何事丁年歲又周霜餘一尊在梅過百花羞七言絶句上許大卿因嗟零落栖遲客舊注聱牙詰屈書腳踏紅塵愧泉石身無清夢到蓬壺晴霧青冥馬首來道逢雙劍倚天開北軒賦就含經緯斗覺靈光氣象推病中春盡言懷萬象無涯春有涯愁腸幾逐夢魂賖解吟整整堂堂句勝看紅紅白白花往省隴阡遭雨有感村煙漸稀村徑失山雨或過山花泣此身浩浩幾轉蓬此口離離當掛壁走筆送王省幹秦樹青冥馬首來路逢雙劍倚天開江山細入騷人眼好帶詩囊古錦回遣興十首好在青山成獨往無端赤縣擁清曹會須披草對田叟豈問無豪即易高閉門不出我何為詞之洽矣昌其詩暗邊沈謝可摸索高處曹劉任指揮月煆便驅詩入社年侵何賴酒為徒而今便作顧夫子白絹搭頭閒著書丈到黃初掃地無我輩乃欲窺唐虞崇崇筆塜遽如許劫劫飢坑有是夫草色當階緑漸侵我觀物化豈無心風軒納絮春無賴雨屋關愁夜不禁牆外遙峯列黛眉堂開尚友好棲遲且栽筠篠成千箇與管烟霞當一司手弄茶月玉川子腸入詩星賈浪仙寒吟苦飲息萬動兩公等是區中賢陜府東郊魏仲先曽言無事小神仙而今懶殘渾到我去子百年仍著鞭一秋病暑暑才退終日倦書書不翻生怕朝衫誇若若且容居士號間間舍南百尺樹駭緑籬外一梢梅破春不須訪我伶俜事儘有幽花料理人題峴山圖樽俎當年緩帶公山月自高亭自逺榮榮枯枯幾晉餘世外蓬萊忽清淺題灞橋圖百篇醉倒長安市古今只數騎鯨李何事騎驢踏玉沙詩叟一寒乃如此春事已深終日坐忘有感靜中我不記吾誰户外春搖百卉腓何處聖賢留箇箇勿喧孔老競師師江頭送别别語離離風作惡羈情滚滚江何盡石頭路滑好一驅入境遲公提正令乙夜覽奏天震動甲科除郎君等閒玉堂再至不小却語邊勿惜鬢毛斑白雲洞我有孤心寓白雲白雲起處自心親白衣蒼狗今休問且伴研朱㸃易人歸巖無定出無心過客從何議淺深只缺太湖三萬頃吞空不許世塵侵石照吳中市井漢淮陰落拓錢郎用意深希世異人人不識却因頑石遂知音題普慈官舍竹軒一生憫憫寄儒冠客路羇愁特地寒擬倩幽梅當供給旋添疏竹報平安虎丘生公說法堂折天一徑入林幽亂石牙牙蹲虎丘不為生公夜㸃首世間般若自頭頭贈金山老一鈴自語風薄林千濤夜湧月翻金寺內何人口生醭阿師政爾息深深距西湖五里至白塔院名藍連五六最幽絶云清流汨汨樹斜斜勝地金山底處家總是光明拳下路任人擊竹笑桃花偶經西湖林逋故宅四聖觀見旁畜野鶴立草徑對之蕭然有懷未分幽容相料理只緣老子合婆娑此中琢句出氷玉曾吸湖光奈爾何霜草深披野徑開幽情端有鶴相媒筆椽擬欲題三尺悔缺一龜行李來再往上竺遊渡西湖忽晴忽雨凄然有感湖頭接城城滿煙湖尾亂樹昏連連從前觸境關心事萬里橋邊家可憐乍濃乍散後前雨相笑相迎來往舟四山眩轉我作惡不慣長湖生許愁遊凌雲寺半日緣雲看九峯江狂樹怪滿雙瞳可憐玉磬僧廊下未奏一聲郊廟中射潮望中劈箭度輕篙誰省儂家意氣豪潮落潮生不關汝三吳是處有風濤秋中再至西湖荷花半殘凄然有後時之嘆縱步投夜歸城中未暇鷗前弄清泚都緣帽底踏黃埃荷花淨盡有底急不待商量細細開禁當芳意忽蟬噪張主客愁惟鴈聲賴有清沂舞雩態湖窮却與月同行送王檢討年丈以足疾辭歸天台孤心琳宇事無事再拜玉門山上山重至玉堂合小却好抽金匱為重刪天台真人分天章曽為詩翁掃粃糠公過故山忽呼出物從衆昧視荒荒幽情不作宦情薄衆足羣知尊足存收拾青鞋聊示病踏鯤却遍水雲村李太白古風高竒或曰能促為竹枝歌體何如戲促李歌為數章黃河溟溟日落海逝川流光不相待春容去我秋髮衰擬欲餐霞駐光彩天津三月桃與李朝能斷腸暮流水緑珠黃犬悲相續何如湖海鴟夷子郢客遺音飛上天誰歌此曲誰為傳但聞色聲紛唱和使我默歎心悽然鄭客入關行未已逢人見謂祖龍死秦人竟去無來蹤千載桃源隔流水隆州有客張陵曾寓此仙乎仙乎生實死鴻名制作往事空盛蹟今應頌天子笑殺丹淵吐語輕山城都不似川城不知禁路春風透幾放溪山照眼明衆山環環萬山過駢首三峯當道卧鬭分蛇鼠舊何人繪入麒麟今幾箇語我馮公有味哉巨靈恰續斷鼇回從今東道君公貴免喚西州市令來贈休上人碧眼不輸巖下電清詩迸出隴頭瀧何須更下牢關鐵出沒無心月在江休善行草故云牢關鐵挽歸潁川喻夫人夫人不訝容髮暮八十解將杯酒度不見歲寒今浩亭花開花落悲行路
