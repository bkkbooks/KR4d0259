body:
  text: 九華集卷十六宋員興宗撰小簡上虞丞相某一向竄伏窮山艱難百罹然萬里浩戀勳德之門寢食以之所謂穹卑有間而心則無間也冬事將艾恭惟機政惟新燮輔休明鈞候萬福某已三熏欲趨屏下以聆謦咳之音夢想顧瞻無須臾之置謹先布惓惓之誠惟鈞慈少加亮察某身墮一隅猶坎井然嵗月不悉南州之事其要者可不問而知知而喜竊聆大賢之進用因卜朝家之休隆耳伏惟某官望髙一代勳冠百辟其雍容宿德故已不朽於前修則或見之矣於今未始見也既積天下之譽徐回久之今始本五兵躋兩地是豈以他岐異轍致之哉天故豐之自葉流根使中外衣冠熟其德播其馨而後見之用也故所得雖遲而所就大矣甚盛甚休某辱知遇之恩最倍夷等其為欣豫不能已已自餘益幾保衛永庇海縣曷勝祈祝之私某恃仁者宿昔之照鈞閫崇嚴敢冒言之某向多困躓非惟自憐雖蜀學公論亦或有相憫者今毛髮種種矣其業履頗亦近古且欲持是安歸乎使鄉來不第尚欲兾幸當世名達有推振者如張愈蘇洵一時薦録為文韓所知是已某且久叨第復為西蜀稍見題品自循其中未必盡出洵愈下也又特膺大賢之知故相公於某久懷悼屈之歎今者入秉機政器足運力足施苟復略而後之則亦無告耳矣昔韓退之保籍湜之不畔去故韓之道日尊而籍湜獲為其徒不然後世何有籍湜哉伏望相公興念於此則大恩大德豈歸他門某所述外史於幽人豪士稍有著見似於國朝大訓不無寸補非敢愚誣自贊也某孤露艱棘之餘心馳德門無由即造有不自聊北辰斗星恭惟外身勤國定勞萬里天相神輔鈞候萬福敢幾為眷注之重保鍊至粹以究光復之勳鈞播萬類下悰不勝叩叩某比因兵留南者輒伺其歸歸即詢以諸軍聲勢敵人消息諸將勇怯雖細人不足以權大事然即其言類皆拱手稽首稱道兩淮荆襄自魏公及先生皆撫摩安慰懦習漸革國威漸立雖無險塞若荆襄為甚而今聲勢亦見矣諸軍幸甚又某官先生醲賞給均勞逸日夜親撫士卒如此則上下氣勢不隔矣氣勢不隔則利害均利害均則驅東而東驅西而西雖蹈水赴火皆為吾用者故曰令其一信將仁以勇士選以飽勝之道也况先生已負海內之望將帥無前之功事適機宜而政兼畏愛跬步登兩地乃餘事耳然區區有懷非門下肺腑之事不敢以稟韓退之為李尚書深之曰藩維雖重閣下居之似稍外若慮有所及宜密以上聞不宜以居外自待接過客俗子不宜泄時事務崇深以拒止嫉妬之口親近醫藥以致和宣滯此三言者皆退之誠於李公之言而亦門下今日之龜鑑也李公不鄙退之之詞卒為名相况先生盛德重望倍萬於李哉故借韓之詞以為請幸澄亮之某屬者多辱手書存記自念摧頽多難之餘疲神古書星霜餘四十矣曲折不遂其稿項空山巖居藿食固當不謂某官纍畨之墨渠渠慰勉不忍俾之賤等瓦礫同棄於道似欲論舉使少伸眉於世自謂庸陋何挾何能而可報稱先生雖達士遴才不間親外而某日抱玷知之恐一味感懼而已某七月初終不子之愆日月飛流尚安所視息哉獨懷揚名之念異時勉之可奉丘壠而某非其人也伏惟某官先生出忠入孝為世所推願推錫類之意挂名言端使曲學俚音粗有所立以償親志則如何其為感為慕也伏惟特賜亮察進之譽之翼而致之幸甚幸甚某惟門下數膺大賜情倍夷等若三山之髙莫可言喻州榜得劉季髙侍郎一紙遂成偉觀山川以人物重輕字畫亦然王公之流字非不徑麗然有如時花旋落旋棄獨魯公乞米帖千載儼然此義可察也鈞諭以劉公名節文章德齒俱髙謹已達之馮守矣志修字亦有法式宜為一方所欽重耳某竊食三館遽已數月每推省大恩崇蔭相望萬里無以酬稱比於鄉人及去兵道襄漢者皆連上起居之問蓋自九月末輪對之後天語甚渥不免有忌惡之者小臣知悉心事君而已其餘進却皆不能計朱堯俞人行已令面稟曲折度恩屏未之知也往日在漢中見義士為諸將所賤甚困故前日劄子專及之劄中指弊病蓋已十七八此先生素所知悉且欲大有所矯革者也今得志得位不為則何以慰西人之望况幕賔如王能父必能為先生同力區置祖其先人之故智也此劄已下使司多時見黃仲秉説先某劄子一日前使司亦申明事目相符如此蓋利病灼然彼巧者以為有心言之耳可發一笑某自秋後連以胃疾在假邇來強扶頭體弱頗費支梧先生逺我誰念之者又旅地私撓百出倉卒未可立具念赦郵最迅故寄心一紙匆匆敘瞻仰不宣某自長江鷁首瞻違俯仰之頃周流半嵗矣羈情逺意與日增結即日庚火俱流恭惟頤護作止天相神休鈞候萬福某冒顔三館日費俸錢雖首末荷仁賢識擢之舉然才下官微未能努力不知補報之所仰恃英明必賜照念耳近聞屢遣旌車相公今日出處又關人代興衰不可不重也昔唐肅代能懲大難化理清明獨李泌為之經營至矣身著白衣不受職故士不忌不離香案而待君命故讒不行兩河叛賊隨其手而舉之泌之所為有以至此也若謀之不堅已復自外職相聨而士必忌君多疑而讒易入雖才若太公何以善其後一日黽勉強為之首尾衡決前日魏公是已願相公纎悉此義蒙德思報不計輕重務罄其誠故輒出此言不賜督過幸甚某竊聞事君有量而後入無入而後量先生決於中必素盡量入之説矣其他人情物態事勢險易子淵子輔必具言之子輔之去甚髙某悵然無侶他事對面荆棘未易宣心若爾相公即為言之不久能為先生再出否端人未易得也子淵詳明又故客能盤桓侍鈞鑑俱來乎都下有他委異日敢不敬承某比於蜀兵王宣處具曲折之記度以次凂鈞座矣心旌控薄無頃不在門下有懷瞻溯與日俱流大冬又薄恭惟藩翰之間外控湖海鈞候動止集福蜀固天逺國大事此不當傳傳之或未信耳聞邇者凡尊主庇民勤邊外身者已皆為首拔此舉也甚休甚偉鄉士有鮑朝卿秀爽有立久從僕遊鄉行甚敦即獲第到天闕參部同輩中最寒約念勳德名世者近自家山誼當執贄於前耳若有艱棘處望為提撕不勝僣越之祝敢以為請逖聽崇亮某秪奉劄命畀職承明實惟君相早夜急才推擇至此然某浮食三館訖無他技重以生平多難積憂成疾彌月在枕退惟清朝優選大典所寄動流無窮安可令病弛者冒焉居之伏望鈞慈特與敷奏改畀望士庶幾公言得伸而亦某退安職分之一也炯炯孤誠伏乞明照某自惟弱植所以培擁而霜露其英華咸自德門發之旦旦敕勵此志猶懼不能千一報也今又辱丞相先生周澤之渥分仁壽之原委以祝其賦形之初藉名德碩大之老二書畀焉羈人非獨有感亦有慙也敬再拜以致悃臆之謝誠蘊微悰默付言外與直閣虞宫使某伏自江上寒濤中論列遽此兩周嵗所矣每因鄉使三拜懇欵之記矣萬里憑尺楮固亦可笑然非此莫能宣心也某於德門父子辱知最深殊愧無毫銖補報但處南州班列間強項不回一絶聲利以此不慙於天地間是乃所以報知己也伏想必為一笑暑候有漸敬承即日琳宇超適神守泰定台候萬福提宮必須侍夫人尊親來益昌人生父子天屬團聚之樂萬鍾之富貴其可敵乎某旅夢三年矣二子方丱中人之習易流每一思之胸趣亦為擾擾自度力微親戚無可倚未能般出蜀耳時中尚兾以門下親賔時賜教飭不勝日夜之望上紹興師相洪文惠公即日春暖恭惟耆明迪哲卧護疲民神天薦祉鈞履嚮用全福某職縻學省盡出鈞鎔何當服勤崇屏仰奉鞭靮親履絇也曷勝依詠某違去崇館幾跨嵗矣疏憃之迹不自齒於俗靜居坐忘而已獨於門下誠有飢渴之勤然奏記布問時作時曠亦恃大君子神融道照不以苛禮為拘拘也比承相君每接人士常形牙頰有存恤憔悴之意相君於士始得其文不特愛其能又憂其身至於切切如此相君真樂士哉冥頑毫髮未有補報門下但思處下陳頌義覿教為終身榮也企仰企仰某嚮嘗論相公先生德爵之重當有與國俱隆者前此略出緒餘選用百吏張持紀綱勳名髙世天眷久渥姑藩翰撫摩之寄然均逸之久與其福一方曷若再踐台鼎遂福天下耶舍人之裝旦晚可趣不佞不佞某束髮志古道常以不合近世繩度為病自分不登衆目相公先生乃形於餘論發於教誘咨以筆墨古始其言奧矣書教枉及三復凛然此退之所謂不以時人見待之情而以古人見待之意直重臣所以敦奬薄俗而後虛名者也某不佞何以處此但鈞問辭嚴義密及衆碑所出何地何里不敢以不詳對緩於申答用是故也其纎悉具見於書伏望鈞慈特賜亮察更為指授其何貺如之鈞閣仙集之眷發祉川增矣都不使令敬三沐以承伏以孟冬之月恭惟某官偃藩卧護神明扶持鈞候動止萬福謹具短啓仰塵記府申候之儀謹列右楮即日冬律告新霜風初戒不審鈞用何似載惟一代儒宗兩朝元老勳德所備何福不除更乞仰副倚毗妙遵時序即聞渙號入冠鼎司以慰蒼生之望云某伏審茂膺天奬來鎮藩輔方面得賢中外稱慶恭惟慶慰竊以會稽巨屏密衛行闕實為東諸侯之長自非耆德莫宜任其責者其間以禮絶之尊暫屈臨之往往為之假途側聞皇上圖舊之念寤寐不忘衮席久虛人謂有待區區之悃得之輿論非敢諛語也恭以某官躬大受之資起中古之治以阿衡納溝之耻為己任以玄齡救時之術為未優而道大不容暫兹去國熙天之績鬱未得施彼都人士莫不引領傾耳以佇大老之歸鼓舞鈞播將天下實賴伏自違去光範再閲寒暑矣雖嘗三貢慶牘三奉誨問足以少慰戀慕之誠猶以不獲一望履舄為恨比者旌纛來臨復以職守無從修敬遡風翹館邈在霄漢下情瞻仰日益惓惓所幸揚庭不久即有依歸預以欣抃仰乞融照冬候紀極恭惟偃藩卧護神相忠嘉台候動止萬福謹具啓仰塵記府修問興居謹布前楮即日春事伊始散凛餘徑不審鈞用何似載惟盛德元老神物呵護敢蘄惠令之餘精調饔寢嗣有渙號以寵公歸區區誠情不勝眷眷某伏審自膺天綸夾輔行闕股肱之郡儲賢得雋中外隱然恭惟慶慰竊以丞相先生深純德履一世譽處故又為東諸侯之長久勞於外天下日望錫衮之期鈞軸又且虛矣非公其誰任敬再述薦紳公祝云某竊伏三館覃精窮思器任有極夙夕依仰恩地志不足達言不足殫也自惟何修何飾而蒙鈞座勉以正大之學可參古昔自省孱虛百念灰冷何為得此於公哉何當密侍左席啓發蒙端為大君子正類之依臨風重有悁企與泉守王龜齡狀元待制某不良時學巖居積數十年晚得一第自度於天下事何等可為者正俯仰不怍以瞻識大君子也退念久糜中都之祿無尺寸以報陛下何面而西乎故邇者歸附之搖搖嬖臣再入皆三館言語議論之職所宜吐口者也何長之可名比觀答宋祕校書乃辱以為今日朝陽之鳴此豈所宜蒙哉前日魏處士元禮亦四三上書及此是公不愧泉石可敬也所可深怪者平時以儒冠自名從而下石以擠斯人名義至此盡矣待制年丈聞此必一浩歎也某雖留然中間飄抑沮動亦風中之葉耳今猶未敢窮日而去以張丞相二三子尚或一意王家兼待制年丈蹈義純明造次不忘吾君也終夕兾旋朝以壯清班耳祈望之誠默付言外與元章大卿某比者劣病相仍矣怪事萬緒何獨燕麥輕搖東風乎老兄視僕此態此抱尚何等可為者如兄涵負乃復散署外縮袖旁睨之餘吾庸知免乎此僕所以每贊諸公摘垂天之翼而斂置道側者獨兄矣知罪知愧元章子輔能甫紹祖同薦入而反覆得旨先二公豈非命哉子輔渡瀘端自不惡一部鼓吹孰與雪雨而待漏兄聲問將為之次矣兄其少安與范偉明運使某違教誼逆數之三年於此矣每念崇才偉度振緒餘則有以驚世繼聞手一道之節百城肅畏今世快士有以超人者果然必公也欽仰殊甚凛冬如許伏惟澄按餘暇神具薦祉台候萬福未瞻晤間丏為修途珍謐以前四輩之招至布至請某自别崇屏艱苦百罹坐暌老成之教侵尋而髮蒼蒼矣獨篤道著書不敢替前九哥機宜學士聞宰一邑書郵定絡繹耳久亦不得記月題風駛大發不掩當有朝燕晡越之功耳欽頌欽頌少請鄉士鮑朝卿字宋卿力學敏劭久從僕遊既得第欲參使部凡有可以提撕者度不待某再三之布也伏紙不勝禱幸之私與王憲伏審某官舂容風義震耀一世然著書之工窮易之祕某下士也鄉者在湯侍郎門下從旁獲覩斯文因論今世名流第一是時心往形留恨無庭下一日之趨而親至教也豈期天幸獲在郡縣使令之末則景仰自慰之素一日伸矣某膚末於學雖有意於先民古書然志有餘而識不逮鄉者濫以明經冠蜀士萬里風濤冒死而歸有司使試簿書退省不敏人微才下奔役固宜然去嵗許大卿今兹王郎中皆以充幕下使令某深惟進身循分當從敕書此非勢之然蓋天所啓因至幸堂下之見也歡抃之極不勝卑悰某恭想中和惠民之風既已稱冠則慶閎上下百趣均祐亦不禱而至也今學士行膺褒然之選西南僉祝虔俟虔俟與喻少穆知縣某夔門言分轉首陳迹矣俯仰再見冬候此情惝恍何如也即日伏計燕息餘間台候萬福表弟度已榮改今必歸憩鄉山去冬榜目倒指吾弟必無逃名既而相遺邂逅決科擇鼠為璞者有司例爾耶安之安之以迓晚成蓋至望也令兄今安在已之官下耶因風寄音不一某束行李南來局退獨靜坐一僧而髮耳天南俗物盈前此道竟誰與語然荷渠儂相推可也表弟知僕樂否乎某來此併去冬已面兩得對皆不自疑外每以表伯郎中捫膝先生為法巾車候去官之穹卑置之度外或者尚以為矯不能恤也一對劄皆拆今日碌碌長成背脅疽根異時心腹肘腋之變可坐而須者幸上聖明能容之蟣蝨臣無憾矣舍姪歸可問劄意謹不敢於此泄之耳有可以開曉者表弟勿外某賤纍皆未能成立亦未謀般挈然夢魂飛於三山之下無日得寧耳表弟何以垂教舊見表伯捫膝先生檄蜀遷都等議豈可令後世無傳便風録示一本并寄行狀志銘之類及劣表勘書於此可為公言之忠節不遂泯沒也少邈曾説及否此最不可緩惟昆仲重圖之慰蔣右相葬母夫人某稽首慰言伏承國封太夫人捐簀日深襄營在目恭惟某官哀摧感慕何以堪處某因風敬唁寄意澘然更祈上為君國社稷抑情俯禮某不勝誠悃之請某竊以搖落之秋風露凄緊旅人履之百感自集又况大孝天鍾德性夙稟者乎伏想某官內銜大恤追慟永久天摧川湮無以喻也苦痛苦痛然退聞先太夫人抱神虛寂雖寓世諦而初無生死往來之相也一生為家植禮為國生賢軻親圭母皆不足進是所以為不朽也萬兾孝情超脫俗苦之外庶廣先志云某嘗思日者國論參辰世故瘠病非得大賢一手撫摩岌岌乎其艱矣前此主上用是進丞相於羣望之中聲業就緒不謂濟川有期而陟屺增悲矣此非獨大門之憂乃元元之憂也某深知故事竊謂富文忠苫席守志確然不奪天下與其孝趙韓王徑以從政視國如家天下以忠孝兼與之况主上今日視丞相一體也一體既外天日炯炯能無望乎願加三思繹至禮以伸大義中外之瞻惟丞相重圖之某兩隨下僚尾拜靈几而又聲慰於大路之側傳謂孝子不忘草木則門下賤士度或在記憶之列也卒卒瞻望如不得門秪益悁耳慰韓叔厚表甥丁父憂某慰言不意凶變禍延大門三哥知府遽然捐簀天涯老表聞問失聲痛怛涕淚不自已己想惟孝性所鍾天地摧裂悲踊奈何苦痛奈何恨以宦遊縻身一方不能振號几筵生平中表把臂之舊黯然萬里消魂而已更望裁哀嚴滅性之戒為門户名業重某竊知三哥半世壯懷不舒近方有一日之適兄弟六千石大門偉事也嘗三歎以賀矣西人續續來或説病狀初不以為信繼又信然終已不起意亦有定數乎直履清致弗遂止此令人不省驚心驚心某所賦危淺鬚髮又與日化旦暮苦求祠祿以西桑榆心迫歸訪肺腑之戚則遂隔世矣此悰此抱悽楚如何慰唁禮如别章表姐鍾意外之禍想惟哀疚不易子孫賢雅晚日可以慰前耳深亮深亮答喻德稱某辱移記勞勉渠渠哀中銘感倍萬矣屬來暑未減伏計苫几翼如以禮自支某不子之咎轉首遂邇祥琴之期痛疚之忘曷日自已也過承以齋信見惠感刻感刻先丈鏟迹民伍而左詩右書退然隱君子之風向年促賦以贈由是也兄乃欲令書幽堂之銘恐不足以酬盛意如何尚容嗣記以既區區之懷也答陳經幹某久違教緒殊切瞻企南州匆匆度嵗每厪三山中表之思忽被箋尺感頌殆不可名秋旻流火尊候間來敬惟萬福某冒顔玉府方懼無以稱塞又歸意促促每馳神鼇之巔矣尚想一陪几杖里中至樂邈存夢境也見彥瞻丈武翁叔凡文社諸父兄敬再拜附鄉仰意起居之間萬兾以壽祉崇嗇至布至頌與榮州勾龍知郡某頓首具稟辱疊紙感思兩極向日逆旅岷下得瞻近先中丞雅意相厚自時嵗月如流老成凋謝使人心感無窮耳既被教約申實如此信然稱其家兒也慰甚慰甚俯仰俄頃名門有人豈容使君久空山耶會體病劣劣作答字不能佳幸孚照與喻子真表兄某頓首啓王子春來聞問具之即日坐計侍候殊休某前此偕舍弟諸人已適山寺四顧幽寂其於文字可冥搜也仙井里儒千百為羣吾表兄不相求之顧欲見咨意者欲相從寂寞之道退之所謂請繼今以言也聞令表李君亦同訪其人蓋寬中隱厚者宜與偕也與喻漢輔某頓首去嵗聞公首冠三山緘書逺賁蹈抃可勝意謂日月即至都下有司眩冒文墨竟亦相遺乃爾怪事怪事僕老矣初奉徵命至江上而主者去國一二相知又連去併斥自分飢寒路旁矣無可言者君相欲招示逺服遂特創此闕司羣士於館此退之所解讓者而况僕矣哉然肝鬲楚越未易言狀願公更勉前修又再周嵗觀光上國矣當有休問也某頓首中間承知首奉計書矣意謂便絶青冥老將又復伏壘耶可念可念嵗易經春比來作止何如運幹文丈里居萬福僕冒顔下館濫為時士且敬且嫉間亦同塵汨泥以自免爾終未若與公輩抵足洞前形神相與也伯椿君節子發德茂相安好否僕侍詔此間客愁縳人臣朔之飢又不免也一笑一笑具手墨達漢輔今已再矣公非遺我者也某南州恍恍度嵗如更朝晚然尚思田間與故人一餉把臂之樂惟夢值耳真感真感秋作矣為父拱侍有佳趣否得所示字大瞻尉某官一念捐竭以報所天此寒儒職分也南冠例亦相鄉獨吾土人數加沮謗欲少加辨質恐為岷峨羞今姑安之耳近奏藝中禁上恱可之賜誥第一不免讒嫉愈衆所倚者正論而已漢輔何以藥我望時惠音切佇切佇
